name: Fix SceneForge Phase 3.0.1

on:
  push:
    branches: [sceneforge-v3]
    paths:
      - '.github/workflows/fix-sceneforge-phase301.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sceneforge-v3
      - name: Apply Phase 3.0.1 fix
        run: python sceneforge-animate/fix_phase301_api_validation.py
      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('sceneforge-animate/phase3.html').read_text(encoding='utf-8')
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/phase3.mjs').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/phase3.mjs
      - name: Sanity checks
        run: |
          grep -q "Phase 3.0.1" sceneforge-animate/phase3.html
          grep -q "multimodal-generation/generation" sceneforge-animate/phase3.html
          grep -q "验证 Qwen" sceneforge-animate/phase3.html
          grep -q "verifyAll" sceneforge-animate/phase3.html
          grep -q "preflightForPlan" sceneforge-animate/phase3.html
          grep -q "fmtProgress" sceneforge-animate/phase3.html
          ! grep -q "compatible-mode/v1/images/generations" sceneforge-animate/phase3.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sceneforge-animate/phase3.html
          git commit -m 'Fix Phase 3.0.1 Qwen API and add provider validation'
          git push origin sceneforge-v3
# trigger
