<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>SceneForge Playground</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#090b10;color:#eef2ff}body{overflow:hidden}#app{display:grid;grid-template-columns:310px 1fr;height:100%}aside{background:#11151d;border-right:1px solid #293244;padding:16px;overflow:auto}.brand{font-weight:800;font-size:20px;margin-bottom:4px}.sub{color:#93a0b5;font-size:12px;margin-bottom:18px}.card{background:#171d28;border:1px solid #293244;border-radius:14px;padding:12px;margin-bottom:12px}label{display:block;color:#a8b3c5;font-size:12px;margin-bottom:7px}textarea{width:100%;height:100px;resize:vertical;background:#0c1119;border:1px solid #33415b;border-radius:10px;color:white;padding:10px;outline:none}button{border:1px solid #384660;background:#1e2737;color:white;border-radius:10px;padding:9px 10px;cursor:pointer}button:hover{background:#28354a}button:disabled{opacity:.55;cursor:wait}.primary{width:100%;margin-top:9px;border:0;background:linear-gradient(135deg,#6f8cff,#9b6cff);font-weight:700}.row{display:flex;gap:7px}.row button{flex:1}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font-size:11px;border:1px solid #35435d;border-radius:999px;padding:5px 7px;color:#b7c2d5;cursor:pointer}.hint{font-size:12px;color:#93a0b5;line-height:1.5}.stage{position:relative;min-width:0}.topbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:3;background:#0b0f16cc;border:1px solid #35415a;border-radius:12px;padding:7px;display:flex;gap:7px;backdrop-filter:blur(10px);max-width:calc(100% - 20px)}.status{position:absolute;bottom:14px;left:14px;right:14px;z-index:3;background:#0b0f16cc;border:1px solid #35415a;border-radius:10px;padding:8px 10px;font-size:12px;color:#c1cada;width:max-content;max-width:calc(100% - 28px)}.badge{color:#9eb8ff}.toast{position:absolute;right:14px;top:14px;z-index:4;background:#172033;border:1px solid #425477;border-radius:10px;padding:9px 11px;font-size:12px;opacity:0;transition:.2s}.toast.show{opacity:1}canvas{display:block;width:100%;height:100%}.credit{font-size:10px;color:#748197;margin-top:8px}
@media(max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:245px 1fr}aside{border-right:0;border-bottom:1px solid #293244;padding:10px}.card:nth-of-type(n+2){display:none}.sub{margin-bottom:8px}.topbar{top:8px}.topbar button{padding:7px 8px;font-size:12px}.status{bottom:8px;left:8px}.brand{font-size:18px}}
</style>
</head>
<body>
<div id="app">
<aside>
<div class="brand">SceneForge</div><div class="sub">纯 JavaScript · Three.js Playground</div>
<div class="card"><label>描述你想生成的场景</label><textarea id="prompt">夜晚的赛博朋克城市，紫色和蓝色霓虹，高楼和道路</textarea><div class="chips"><span class="chip" data-p="赛博朋克城市，霓虹灯，高楼和道路">赛博城市</span><span class="chip" data-p="现代商业城市，有真实建筑、街道和树">现代城市</span><span class="chip" data-p="极简桌面，有显示器、键盘、台灯和咖啡杯">桌面</span><span class="chip" data-p="宇宙星球，有行星、月亮和星星">星球</span><span class="chip" data-p="低多边形森林，有树木、岩石和小路">森林</span></div><button id="gen" class="primary">✨ 生成场景</button><div class="credit">城市建筑/树木：Quaternius CC0 · Web 优化 GLB</div></div>
<div class="card"><label>快速操作</label><div class="row"><button data-add="box">立方体</button><button data-add="sphere">球体</button><button data-add="cylinder">圆柱</button></div><div class="row" style="margin-top:7px"><button id="random">🎲 随机</button><button id="clear">清空</button></div></div>
<div class="card"><div class="hint">拖动旋转视角，双指/滚轮缩放。点击建筑或物体选中，再用顶部按钮移动、旋转、缩放。城市模式现在加载真实 GLB 素材，不再用盒子冒充大楼。</div></div>
</aside>
<main class="stage" id="stage"><div class="topbar"><button id="move">移动</button><button id="rotate">旋转</button><button id="scale">缩放</button><button id="focus">聚焦</button><button id="del">删除</button></div><div class="status"><span class="badge">DEMO</span>　<span id="status">正在载入 3D 素材…</span></div><div id="toast" class="toast"></div></main>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {TransformControls} from 'three/addons/controls/TransformControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const stage=document.getElementById('stage'), scene=new THREE.Scene();
scene.background=new THREE.Color(0x090b10); scene.fog=new THREE.Fog(0x090b10,30,95);
const cam=new THREE.PerspectiveCamera(52,1,.1,400); cam.position.set(13,10,17);
const r=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'}); r.setPixelRatio(Math.min(devicePixelRatio,1.75)); r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap; r.outputColorSpace=THREE.SRGBColorSpace; r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.1; stage.appendChild(r.domElement);
const orbit=new OrbitControls(cam,r.domElement); orbit.enableDamping=true; orbit.target.set(0,2,0); orbit.maxPolarAngle=Math.PI*.49; orbit.minDistance=3; orbit.maxDistance=80;
const tc=new TransformControls(cam,r.domElement); scene.add(tc.getHelper()); tc.addEventListener('dragging-changed',e=>orbit.enabled=!e.value); tc.setMode('translate');
scene.add(new THREE.HemisphereLight(0xa9bfff,0x1a1610,1.7)); const sun=new THREE.DirectionalLight(0xfff4dc,3.7); sun.position.set(12,18,9); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-35; sun.shadow.camera.right=35; sun.shadow.camera.top=35; sun.shadow.camera.bottom=-35; scene.add(sun);
const fill=new THREE.DirectionalLight(0x6e88ff,1.1);fill.position.set(-12,7,-10);scene.add(fill);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(140,140),new THREE.MeshStandardMaterial({color:0x141a22,roughness:.96})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
const grid=new THREE.GridHelper(140,140,0x34415a,0x20293a); grid.position.y=.012; grid.material.opacity=.24; grid.material.transparent=true; scene.add(grid);
const root=new THREE.Group(); scene.add(root); let selected=null,seq=1; const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
const loader=new GLTFLoader(); const templates={};
const ASSET_BASE='https://cdn.jsdelivr.net/gh/anshaneja5/skyline-run@main/public/assets/models/';
const ASSETS={small:'b_small.glb',medium:'b_medium.glb',large:'b_large.glb',tree1:'tree1.glb',tree2:'tree2.glb',tree3:'tree3.glb'};

function setStatus(t){document.getElementById('status').textContent=t}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1200)}
function material(c='#6f8cff',em='#000000',ei=0){return new THREE.MeshStandardMaterial({color:c,roughness:.62,metalness:.12,emissive:em,emissiveIntensity:ei})}
function add(kind='box',o={}){let g=kind==='sphere'?new THREE.SphereGeometry(.65,28,18):kind==='cylinder'?new THREE.CylinderGeometry(.55,.55,1.3,24):kind==='cone'?new THREE.ConeGeometry(.7,1.8,20):new THREE.BoxGeometry(1,1,1);const m=new THREE.Mesh(g,material(o.color,o.emissive,o.ei));m.name=o.name||kind+'-'+seq++;m.position.fromArray(o.pos||[0,.5,0]);m.scale.fromArray(o.scale||[1,1,1]);m.rotation.set(...(o.rot||[0,0,0]));m.castShadow=m.receiveShadow=true;m.userData.selectRoot=m;root.add(m);return m}
function clear(){tc.detach();selected=null;while(root.children.length)root.remove(root.children[0]);}
function markSelectable(g){g.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true;n.userData.selectRoot=g}});g.userData.selectRoot=g;return g}
function normalizeModel(obj){const box=new THREE.Box3().setFromObject(obj),size=box.getSize(new THREE.Vector3());const s=1/Math.max(size.y,.001);obj.scale.multiplyScalar(s);const b2=new THREE.Box3().setFromObject(obj),center=b2.getCenter(new THREE.Vector3());obj.position.x-=center.x;obj.position.z-=center.z;obj.position.y-=b2.min.y;const g=new THREE.Group();g.add(obj);return markSelectable(g)}
function loadModel(url){return new Promise((resolve,reject)=>loader.load(url,g=>resolve(normalizeModel(g.scene)),undefined,reject))}
async function preload(){const gen=document.getElementById('gen');gen.disabled=true;try{setStatus('首次打开：正在加载约 7 MB 城市素材…');for(const [k,f] of Object.entries(ASSETS))templates[k]=await loadModel(ASSET_BASE+f);setStatus('真实 GLB 素材已加载。开始生成城市…')}catch(e){console.error(e);setStatus('部分在线素材加载失败，会自动回退到基础几何体。')}finally{gen.disabled=false}}
function assetInstance(key,height,pos,rotY=0){const t=templates[key];if(!t)return add('box',{name:'Fallback building',color:'#5a6680',pos:[pos[0],height/2,pos[2]],scale:[height*.45,height,height*.45]});const g=t.clone(true);g.name='GLB '+key;g.scale.setScalar(height);g.position.set(...pos);g.rotation.y=rotY;markSelectable(g);root.add(g);return g}
function treeInstance(x,z,h=2){const keys=['tree1','tree2','tree3'];const k=keys[Math.floor(Math.random()*keys.length)];const t=templates[k];if(!t)return add('cone',{name:'Tree',color:'#3c8450',pos:[x,h*.5,z],scale:[.6,h,.6]});const g=t.clone(true);g.name='Tree';g.scale.setScalar(h);g.position.set(x,0,z);g.rotation.y=Math.random()*Math.PI*2;markSelectable(g);root.add(g);return g}
function roadPiece(x,z,w,d){const m=add('box',{name:'Road',color:'#222832',pos:[x,.035,z],scale:[w,.07,d]});m.material.roughness=.98;return m}
function sidewalk(x,z,w,d){return add('box',{name:'Sidewalk',color:'#6e7378',pos:[x,.075,z],scale:[w,.15,d]})}
function neonPanel(x,y,z,color,rotY=0){const m=add('box',{name:'Neon sign',color,emissive:color,ei:5,pos:[x,y,z],scale:[.08,.28,.78],rot:[0,rotY,0]});m.userData.decor=true;return m}
async function city(p){clear();ground.visible=grid.visible=true;scene.fog.near=32;scene.fog.far=95;const cyber=/赛博|cyber|霓虹|neon/i.test(p);roadPiece(0,0,5.2,36);roadPiece(0,0,36,5.2);sidewalk(-4.1,0,2.6,36);sidewalk(4.1,0,2.6,36);sidewalk(0,-4.1,36,2.6);sidewalk(0,4.1,36,2.6);
const spots=[[-7,-14,4.8,'small'],[-11,-9,7.5,'medium'],[-8,-3,10,'large'],[-12,8,6.5,'small'],[-8,14,8.5,'medium'],[7,-14,8,'medium'],[11,-9,5.5,'small'],[8,-3,11,'large'],[12,8,8,'medium'],[8,14,5,'small']];
const neon=['#ff3fa4','#2de2ff','#9868ff','#ffd25b'];spots.forEach((s,i)=>{const [x,z,h,k]=s;const b=assetInstance(k,h,[x,0,z],x<0?Math.PI*.5:-Math.PI*.5);if(cyber){const side=x<0?1:-1;neonPanel(x+side*(1.2+Math.random()*.5),Math.min(h*.55,4.5),z,neon[i%neon.length],0)}});
for(let z=-15;z<=15;z+=5.2){treeInstance(-5.2,z,1.6+Math.random()*.5);treeInstance(5.2,z+.8,1.5+Math.random()*.55)}
for(let i=-5;i<=5;i++){if(i===0)continue;add('box',{name:'Lane mark',color:'#f1d987',emissive:'#6f5a22',ei:.45,pos:[0,.09,i*3],scale:[.10,.02,1.4]});add('box',{name:'Lane mark',color:'#f1d987',emissive:'#6f5a22',ei:.45,pos:[i*3,.09,0],scale:[1.4,.02,.10]})}
fit();setStatus(cyber?'已生成：真实 GLB 建筑 + 赛博霓虹城市。':'已生成：真实 GLB 建筑商业街区。')}
function desk(){clear();ground.visible=grid.visible=true;add('box',{name:'Desk',color:'#7a5337',pos:[0,2,0],scale:[7,.28,3.6]});add('box',{name:'Monitor',color:'#171c25',pos:[0,3.4,-.4],scale:[3.3,1.9,.18]});add('box',{name:'Screen',color:'#254db0',emissive:'#315cff',ei:2,pos:[0,3.4,-.29],scale:[3,1.6,.03]});add('box',{name:'Keyboard',color:'#d2d7df',pos:[0,2.27,.8],rot:[-.15,0,0],scale:[2.4,.12,.85]});add('cylinder',{name:'Coffee',color:'#eee6d8',pos:[2.2,2.45,.7],scale:[.45,.65,.45]});add('sphere',{name:'Lamp',color:'#ffd273',emissive:'#ffb84a',ei:4,pos:[-2.4,3.7,-.8],scale:[.55,.55,.55]});fit();setStatus('已生成桌面场景。')}
function planet(){clear();ground.visible=grid.visible=false;add('sphere',{name:'Planet',color:'#3879ee',pos:[0,2,0],scale:[3.7,3.7,3.7]});add('sphere',{name:'Moon',color:'#beb8aa',pos:[7,4,-1],scale:[1.1,1.1,1.1]});for(let i=0;i<55;i++){const s=.04+Math.random()*.09;add('sphere',{name:'Star',color:'#fff',emissive:'#fff',ei:4,pos:[(Math.random()-.5)*40,2+(Math.random()-.5)*23,(Math.random()-.5)*35],scale:[s,s,s]})}fit();setStatus('已生成星球场景。')}
function forest(){clear();ground.visible=grid.visible=true;for(let i=0;i<24;i++){const x=(Math.random()-.5)*18,z=(Math.random()-.5)*18;if(Math.abs(x)<1.5)continue;treeInstance(x,z,1.5+Math.random()*1.3)}add('box',{name:'Path',color:'#725e48',pos:[0,.04,0],scale:[2,.06,20]});fit();setStatus('已生成：使用真实 GLB 树木的森林。')}
function abstract(){clear();ground.visible=grid.visible=true;for(let i=0;i<16;i++){const k=['box','sphere','cylinder','cone'][Math.floor(Math.random()*4)],s=.5+Math.random()*1.2;add(k,{color:['#6f8cff','#a875ff','#39d0c7','#ff7aa8','#f6b65e'][i%5],pos:[(Math.random()-.5)*12,s*.6,(Math.random()-.5)*10],scale:[s,.5+Math.random()*2,s],rot:[Math.random()*.4,Math.random()*3,0]})}fit();setStatus('生成了一个抽象随机场景。')}
async function generate(p){const gen=document.getElementById('gen');gen.disabled=true;try{ground.visible=grid.visible=true;if(/城市|city|赛博|cyber|霓虹|neon|商业|building/i.test(p))await city(p);else if(/桌|desk|电脑|office/i.test(p))desk();else if(/星球|planet|宇宙|space|月亮|moon/i.test(p))planet();else if(/森林|forest|树|tree/i.test(p))forest();else abstract()}finally{gen.disabled=false}}
function fit(){const b=new THREE.Box3().setFromObject(root);if(b.isEmpty())return;const s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),d=Math.max(s.x,s.y,s.z)*.62+5;cam.position.set(c.x+d*.72,c.y+Math.min(d*.48,14),c.z+d*.82);orbit.target.copy(c);orbit.update()}
function selectableRoot(o){while(o&&o!==root){if(o.userData?.selectRoot)return o.userData.selectRoot;o=o.parent}return null}
function select(o){selected=o;tc.detach();if(o)tc.attach(o)}
r.domElement.addEventListener('pointerdown',e=>{if(tc.axis)return;const rect=r.domElement.getBoundingClientRect();mouse.x=((e.clientX-rect.left)/rect.width)*2-1;mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;ray.setFromCamera(mouse,cam);const h=ray.intersectObjects(root.children,true);select(h.length?selectableRoot(h[0].object):null)});
function mode(m){tc.setMode(m);toast(m==='translate'?'移动模式':m==='rotate'?'旋转模式':'缩放模式')}
document.getElementById('move').onclick=()=>mode('translate');document.getElementById('rotate').onclick=()=>mode('rotate');document.getElementById('scale').onclick=()=>mode('scale');document.getElementById('focus').onclick=fit;document.getElementById('del').onclick=()=>{if(selected){tc.detach();selected.parent?.remove(selected);selected=null;toast('已删除')}};
document.getElementById('gen').onclick=()=>generate(document.getElementById('prompt').value);document.querySelectorAll('.chip').forEach(e=>e.onclick=()=>{document.getElementById('prompt').value=e.dataset.p;generate(e.dataset.p)});document.querySelectorAll('[data-add]').forEach(e=>e.onclick=()=>{ground.visible=grid.visible=true;select(add(e.dataset.add,{pos:[0,1,0]}));toast('已添加')});document.getElementById('random').onclick=()=>{const p=['赛博朋克城市','现代商业城市','极简桌面','宇宙星球','低多边形森林'][Math.floor(Math.random()*5)];document.getElementById('prompt').value=p;generate(p)};document.getElementById('clear').onclick=()=>{clear();ground.visible=grid.visible=true;setStatus('场景已清空。')};
function resize(){const w=stage.clientWidth,h=stage.clientHeight;cam.aspect=w/Math.max(1,h);cam.updateProjectionMatrix();r.setSize(w,h,false)} new ResizeObserver(resize).observe(stage); resize();
(function loop(){requestAnimationFrame(loop);orbit.update();r.render(scene,cam)})();
await preload(); await generate(document.getElementById('prompt').value);
</script>
</body></html>
