<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SceneForge Playground</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#090b10;color:#eef2ff}body{overflow:hidden}#app{display:grid;grid-template-columns:310px 1fr;height:100%}aside{background:#11151d;border-right:1px solid #293244;padding:16px;overflow:auto}.brand{font-weight:800;font-size:20px;margin-bottom:4px}.sub{color:#93a0b5;font-size:12px;margin-bottom:18px}.card{background:#171d28;border:1px solid #293244;border-radius:14px;padding:12px;margin-bottom:12px}label{display:block;color:#a8b3c5;font-size:12px;margin-bottom:7px}textarea{width:100%;height:100px;resize:vertical;background:#0c1119;border:1px solid #33415b;border-radius:10px;color:white;padding:10px;outline:none}button{border:1px solid #384660;background:#1e2737;color:white;border-radius:10px;padding:9px 10px;cursor:pointer}button:hover{background:#28354a}.primary{width:100%;margin-top:9px;border:0;background:linear-gradient(135deg,#6f8cff,#9b6cff);font-weight:700}.row{display:flex;gap:7px}.row button{flex:1}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font-size:11px;border:1px solid #35435d;border-radius:999px;padding:5px 7px;color:#b7c2d5;cursor:pointer}.hint{font-size:12px;color:#93a0b5;line-height:1.5}.stage{position:relative}.topbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:3;background:#0b0f16cc;border:1px solid #35415a;border-radius:12px;padding:7px;display:flex;gap:7px;backdrop-filter:blur(10px)}.status{position:absolute;bottom:14px;left:14px;z-index:3;background:#0b0f16cc;border:1px solid #35415a;border-radius:10px;padding:8px 10px;font-size:12px;color:#c1cada}.badge{color:#9eb8ff}.toast{position:absolute;right:14px;top:14px;z-index:4;background:#172033;border:1px solid #425477;border-radius:10px;padding:9px 11px;font-size:12px;opacity:0;transition:.2s}.toast.show{opacity:1}canvas{display:block;width:100%;height:100%}@media(max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:245px 1fr}aside{border-right:0;border-bottom:1px solid #293244;padding:10px}.card:nth-of-type(n+2){display:none}.sub{margin-bottom:8px}}
</style>
</head>
<body>
<div id="app">
<aside>
<div class="brand">SceneForge</div><div class="sub">纯 JavaScript · Three.js Playground</div>
<div class="card"><label>描述你想生成的场景</label><textarea id="prompt">夜晚的赛博朋克城市，紫色和蓝色霓虹，高楼和道路</textarea><div class="chips"><span class="chip" data-p="赛博朋克城市，霓虹灯，高楼和道路">赛博城市</span><span class="chip" data-p="极简桌面，有显示器、键盘、台灯和咖啡杯">桌面</span><span class="chip" data-p="宇宙星球，有行星、月亮和星星">星球</span><span class="chip" data-p="低多边形森林，有树木、岩石和小路">森林</span></div><button id="gen" class="primary">✨ 生成场景</button></div>
<div class="card"><label>快速操作</label><div class="row"><button data-add="box">立方体</button><button data-add="sphere">球体</button><button data-add="cylinder">圆柱</button></div><div class="row" style="margin-top:7px"><button id="random">🎲 随机</button><button id="clear">清空</button></div></div>
<div class="card"><div class="hint">鼠标左键旋转视角，滚轮缩放。点击物体选中，再用顶部按钮移动、旋转、缩放。这个版本完全在浏览器运行，不调用后端或 AI API。</div></div>
</aside>
<main class="stage" id="stage"><div class="topbar"><button id="move">移动</button><button id="rotate">旋转</button><button id="scale">缩放</button><button id="focus">聚焦</button><button id="del">删除</button></div><div class="status"><span class="badge">DEMO</span>　<span id="status">正在载入…</span></div><div id="toast" class="toast"></div></main>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {TransformControls} from 'three/addons/controls/TransformControls.js';
const stage=document.getElementById('stage'),scene=new THREE.Scene();scene.background=new THREE.Color(0x090b10);scene.fog=new THREE.Fog(0x090b10,25,75);
const cam=new THREE.PerspectiveCamera(55,1,.1,300);cam.position.set(10,8,13);
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;r.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(r.domElement);
const orbit=new OrbitControls(cam,r.domElement);orbit.enableDamping=true;orbit.target.set(0,1.5,0);
const tc=new TransformControls(cam,r.domElement);scene.add(tc.getHelper());tc.addEventListener('dragging-changed',e=>orbit.enabled=!e.value);tc.setMode('translate');
scene.add(new THREE.HemisphereLight(0xb7c8ff,0x17130f,2));const sun=new THREE.DirectionalLight(0xffffff,3.3);sun.position.set(8,12,7);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x121824,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(100,100,0x34415a,0x20293a);grid.position.y=.006;scene.add(grid);
const root=new THREE.Group();scene.add(root);let selected=null,seq=1;const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
function material(c='#6f8cff',em='#000000',ei=0){return new THREE.MeshStandardMaterial({color:c,roughness:.62,metalness:.12,emissive:em,emissiveIntensity:ei})}
function add(kind='box',o={}){let g=kind==='sphere'?new THREE.SphereGeometry(.65,28,18):kind==='cylinder'?new THREE.CylinderGeometry(.55,.55,1.3,24):kind==='cone'?new THREE.ConeGeometry(.7,1.8,20):new THREE.BoxGeometry(1,1,1);const m=new THREE.Mesh(g,material(o.color,o.emissive,o.ei));m.name=o.name||kind+'-'+seq++;m.position.fromArray(o.pos||[0,.5,0]);m.scale.fromArray(o.scale||[1,1,1]);m.rotation.set(...(o.rot||[0,0,0]));m.castShadow=m.receiveShadow=true;m.userData.kind=kind;root.add(m);return m}
function clear(){tc.detach();selected=null;while(root.children.length){const o=root.children.pop();o.traverse(n=>{n.geometry?.dispose();n.material?.dispose?.()})}}
function city(p){clear();const cyber=/赛博|cyber|霓虹|neon/i.test(p);add('box',{name:'Road',color:'#20252f',pos:[0,.05,0],scale:[3,.1,22]});const neon=['#ff3fa4','#26dbff','#9b67ff','#ffd45d'];for(let i=-5;i<=5;i++){if(!i)continue;for(const s of[-1,1]){const h=2+Math.random()*6,w=1.4+Math.random()*1.6,z=i*3,x=s*(3.2+w*.65+Math.random()*1.5);add('box',{name:'Building',color:cyber?'#314375':'#6e7d91',pos:[x,h/2,z],scale:[w,h,2+Math.random()]});if(cyber)add('box',{name:'Neon',color:neon[(i+11)%4],emissive:neon[(i+11)%4],ei:4,pos:[x-s*(w/2+.07),Math.min(h-.5,2+Math.random()*h*.5),z],scale:[.08,.35,.7]})}}fit();setStatus('已生成赛博城市：点击建筑试试。')}
function desk(){clear();add('box',{name:'Desk',color:'#7a5337',pos:[0,2,0],scale:[7,.28,3.6]});add('box',{name:'Monitor',color:'#171c25',pos:[0,3.4,-.4],scale:[3.3,1.9,.18]});add('box',{name:'Screen',color:'#254db0',emissive:'#315cff',ei:2,pos:[0,3.4,-.29],scale:[3,1.6,.03]});add('box',{name:'Keyboard',color:'#d2d7df',pos:[0,2.27,.8],rot:[-.15,0,0],scale:[2.4,.12,.85]});add('cylinder',{name:'Coffee',color:'#eee6d8',pos:[2.2,2.45,.7],scale:[.45,.65,.45]});add('sphere',{name:'Lamp',color:'#ffd273',emissive:'#ffb84a',ei:4,pos:[-2.4,3.7,-.8],scale:[.55,.55,.55]});fit();setStatus('已生成桌面场景。')}
function planet(){clear();ground.visible=grid.visible=false;add('sphere',{name:'Planet',color:'#3879ee',pos:[0,2,0],scale:[3.7,3.7,3.7]});add('sphere',{name:'Moon',color:'#beb8aa',pos:[7,4,-1],scale:[1.1,1.1,1.1]});for(let i=0;i<55;i++){const s=.04+Math.random()*.09;add('sphere',{name:'Star',color:'#fff',emissive:'#fff',ei:4,pos:[(Math.random()-.5)*40,2+(Math.random()-.5)*23,(Math.random()-.5)*35],scale:[s,s,s]})}fit();setStatus('已生成星球场景。')}
function forest(){clear();for(let i=0;i<18;i++){const x=(Math.random()-.5)*16,z=(Math.random()-.5)*16,h=2+Math.random()*2;add('cylinder',{name:'Trunk',color:'#694a34',pos:[x,h*.3,z],scale:[.22,h*.6,.22]});add('cone',{name:'Tree',color:i%3?'#337d4b':'#4e9658',pos:[x,h*.9,z],scale:[.9,h*.65,.9]})}add('box',{name:'Path',color:'#725e48',pos:[0,.04,0],scale:[2,.06,18]});fit();setStatus('已生成森林场景。')}
function abstract(){clear();for(let i=0;i<16;i++){const k=['box','sphere','cylinder','cone'][Math.floor(Math.random()*4)],s=.5+Math.random()*1.2;add(k,{color:['#6f8cff','#a875ff','#39d0c7','#ff7aa8','#f6b65e'][i%5],pos:[(Math.random()-.5)*12,s*.6,(Math.random()-.5)*10],scale:[s,.5+Math.random()*2,s],rot:[Math.random()*.4,Math.random()*3,0]})}fit();setStatus('生成了一个抽象随机场景。')}
function generate(p){ground.visible=grid.visible=true;if(/城市|city|赛博|cyber|霓虹|neon/i.test(p))city(p);else if(/桌|desk|电脑|office/i.test(p))desk();else if(/星球|planet|宇宙|space|月亮|moon/i.test(p))planet();else if(/森林|forest|树|tree/i.test(p))forest();else abstract()}
function fit(){const b=new THREE.Box3().setFromObject(root);if(b.isEmpty())return;const s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),d=Math.max(s.x,s.y,s.z)*.75+4;cam.position.set(c.x+d*.75,c.y+d*.55,c.z+d);orbit.target.copy(c);orbit.update()}
function select(o){selected=o;tc.detach();if(o)tc.attach(o)}
function setStatus(t){document.getElementById('status').textContent=t}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1200)}
r.domElement.addEventListener('pointerdown',e=>{if(tc.axis)return;const rect=r.domElement.getBoundingClientRect();mouse.x=((e.clientX-rect.left)/rect.width)*2-1;mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;ray.setFromCamera(mouse,cam);const h=ray.intersectObjects(root.children,true);select(h.length?h[0].object:null)});
function mode(m){tc.setMode(m);toast(m==='translate'?'移动模式':m==='rotate'?'旋转模式':'缩放模式')}
document.getElementById('move').onclick=()=>mode('translate');document.getElementById('rotate').onclick=()=>mode('rotate');document.getElementById('scale').onclick=()=>mode('scale');document.getElementById('focus').onclick=fit;document.getElementById('del').onclick=()=>{if(selected){const o=selected;tc.detach();root.remove(o);selected=null;toast('已删除')}};
document.getElementById('gen').onclick=()=>generate(document.getElementById('prompt').value);document.querySelectorAll('.chip').forEach(e=>e.onclick=()=>{document.getElementById('prompt').value=e.dataset.p;generate(e.dataset.p)});document.querySelectorAll('[data-add]').forEach(e=>e.onclick=()=>{ground.visible=grid.visible=true;select(add(e.dataset.add,{pos:[0,1,0]}));toast('已添加')});document.getElementById('random').onclick=()=>generate(['赛博城市','极简桌面','宇宙星球','低多边形森林','抽象雕塑'][Math.floor(Math.random()*5)]);document.getElementById('clear').onclick=()=>{clear();ground.visible=grid.visible=true;setStatus('场景已清空。')};
function resize(){const w=stage.clientWidth,h=stage.clientHeight;cam.aspect=w/Math.max(1,h);cam.updateProjectionMatrix();r.setSize(w,h,false)}new ResizeObserver(resize).observe(stage);resize();
(function loop(){requestAnimationFrame(loop);orbit.update();r.render(scene,cam)})();generate(document.getElementById('prompt').value);
</script>
</body></html>
