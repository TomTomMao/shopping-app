<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#090b10;color:#eef2ff}body{overflow:hidden}button,input,textarea{font:inherit}button{border:1px solid #384660;background:#1e2737;color:#fff;border-radius:9px;padding:8px 9px;cursor:pointer}#app{display:grid;grid-template-rows:238px 1fr;height:100vh}.aiDock{background:#10151e;border-bottom:1px solid #2b3549;padding:10px 12px;display:grid;grid-template-columns:260px minmax(280px,1fr) 360px;gap:10px;min-height:0}.dockCol{min-width:0;min-height:0}.brand{display:flex;align-items:center;gap:7px;font-size:19px;font-weight:800}.tag{font-size:10px;padding:3px 6px;border-radius:999px;background:#243c69;color:#b7caff}.sub{font-size:11px;color:#8f9cb1;margin:4px 0 10px}.modelTag{font-size:10px;color:#a9bcff}.keyRow{display:flex;gap:6px}.keyRow input{flex:1;min-width:0;background:#090d14;border:1px solid #34425d;color:white;border-radius:9px;padding:8px}.tiny{font-size:10px;color:#748197;line-height:1.4;margin-top:6px}.examples{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.ex{font-size:10px;padding:5px 7px;border:1px solid #32405a;border-radius:999px;color:#aab7ca;cursor:pointer}.chatWrap{background:#0c1119;border:1px solid #29364c;border-radius:12px;padding:7px;height:100%;display:flex;flex-direction:column}.chatTitle{font-size:11px;color:#8697b2;margin:1px 3px 5px}.chat{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0;flex:1}.msg{font-size:11px;line-height:1.4;padding:7px 8px;border-radius:9px;white-space:pre-wrap}.user{align-self:flex-end;background:#263b69;max-width:88%}.assistant{align-self:flex-start;background:#1b2432;max-width:94%}.reason{background:#0d121a;border:1px solid #273348;border-radius:8px;margin-top:5px;padding:5px 7px;font-size:10px;color:#aeb9cb}.reason summary{cursor:pointer;color:#8ea8e8}.reason pre{white-space:pre-wrap;margin:5px 0 0;font-family:inherit}.composerBox{display:flex;flex-direction:column;height:1 <body>
<div id="app">
  <section class="aiDock">
    <div class="dockCol identity">
      <div>
        <div class="brand">SceneForge <span class="tag">AI v5</span></div>
        <div class="sub">DeepSeek V4.1 Flash · 对话调整场景</div>
        <div class="keyRow"><input id="apiKey" type="password" autocomplete="off" placeholder="DeepSeek API Key (sk-...)"/><button id="clearKey">清除</button></div>
        <div class="tiny">Key 仅存在当前标签页 sessionStorage。</div>
      </div>
      <div class="examples"><span class="ex">右边再加3栋高楼</span><span class="ex">树少一半</span><span class="ex">楼围着路口更密集</span><span class="ex">变成赛博朋克布局</span></div>
    </div>
    <div class="dockCol chatWrap">
      <div class="chatTitle">场景助手 · <span class="modelTag">deepseek-flash</span></div>
      <div id="chat" class="chat"><div class="msg assistant">直接告诉我怎么改布局，我会修改场景数据并立即重建 3D 场景。</div></div>
    </div>
    <div class="dockCol composerBox">
      <textarea id="chatInput" placeholder="例如：把最高的两栋楼放到十字路口东北和西南，右侧再加三栋高楼"></textarea>
      <div class="sendRow"><button id="send" class="send">发送</button><button id="focus">聚焦场景</button></div>
    </div>
  </section>
  <main id="stage" class="stage">
    <div class="topbar"><button id="move">移动</button><button id="rotate">旋转</button><button id="scale">缩放</button></div>
    <div id="status" class="status">正在加载真实 GLB 建筑…</div>
  </main>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {TransformControls} from 'three/addons/controls/TransformControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const stage=document.getElementById('stage'),statusEl=document.getElementById('status');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0d13);scene.fog=new THREE.Fog(0x0a0d13,35,105);
const camera=new THREE.PerspectiveCamera(52,1,.1,400);camera.position.set(19,13,22);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;stage.appendChild(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.target.set(0,3,0);orbit.maxPolarAngle=Math.PI*.49;orbit.minDistance=4;orbit.maxDistance=90;
const transform=new TransformControls(camera,renderer.domElement);scene.add(transform.getHelper());transform.addEventListener('dragging-changed',e=>orbit.enabled=!e.value);
scene.add(new THREE.HemisphereLight(0xb6c7ff,0x241d14,1.8));const sun=new THREE.DirectionalLight(0xfff0d6,3.8);sun.position.set(16,22,12);sun.castShadow=true;scene.add(sun);const blue=new THREE.DirectionalLight(0x6889ff,1);blue.position.set(-15,10,-10);scene.add(blue);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(150,150),new THREE.MeshStandardMaterial({color:0x171c24,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const root=new THREE.Group();scene.add(root);const loader=new GLTFLoader(),templates={};let selected=null;
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
const BASE='https://cdn.jsdelivr.net/gh/anshaneja5/skyline-run@main/public/assets/models/';
const files={small:'b_small.glb',medium:'b_medium.glb',large:'b_large.glb',tree1:'tree1.glb',tree2:'tree2.glb',tree3:'tree3.glb'};
let sceneState={style:'modern',roadWidth:5.3,roadLength:40,buildings:[{id:'b1',type:'small',x:-8,z:-15,height:5,rotation:1.57},{id:'b2',type:'medium',x:-13,z:-10,height:8,rotation:1.57},{id:'b3',type:'large',x:-9,z:-3,height:11,rotation:1.57},{id:'b4',type:'small',x:-13,z:9,height:6.5,rotation:1.57},{id:'b5',type:'medium',x:-8,z:15,height:9,rotation:1.57},{id:'b6',type:'medium',x:8,z:-15,height:8.5,rotation:-1.57},{id:'b7',type:'small',x:13,z:-10,height:5.5,rotation:-1.57},{id:'b8',type:'large',x:9,z:-3,height:12,rotation:-1.57},{id:'b9',type:'medium',x:13,z:9,height:8.5,rotation:-1.57},{id:'b10',type:'small',x:8,z:15,height:5.5,rotation:-1.57}],trees:[]};
for(let z=-16,i=0;z<=16;z+=4.8){sceneState.trees.push({id:'tl'+i,x:-5.3,z,height:1.9});sceneState.trees.push({id:'tr'+i,x:5.3,z:z+.7,height:1.8});i++}
function setStatus(t,c=''){statusEl.className='status '+c;statusEl.textContent=t}
function clamp(v,min,max,fallback){v=Number(v);return Number.isFinite(v)?Math.max(min,Math.min(max,v)):fallback}
function addBox(name,color,pos,scale,emissive=null){const mat=new THREE.MeshStandardMaterial({color,roughness:.82,metalness:.08});if(emissive){mat.emissive=new THREE.Color(emissive);mat.emissiveIntensity=3.6}const m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),mat);m.name=name;m.position.set(...pos);m.scale.set(...scale);m.castShadow=m.receiveShadow=true;m.userData.assetRoot=true;m.userData.sceneKind='decor';root.add(m);return m}
function clearRoot(){transform.detach();selected=null;while(root.children.length)root.remove(root.children[0])}
function normalizeTemplate(o){const b=new THREE.Box3().setFromObject(o),s=b.getSize(new THREE.Vector3());o.scale.multiplyScalar(1/Math.max(s.y,.001));const b2=new THREE.Box3().setFromObject(o),c=b2.getCenter(new THREE.Vector3());o.position.x-=c.x;o.position.z-=c.z;o.position.y-=b2.min.y;o.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true}});const h=new THREE.Group();h.add(o);return h}
async function preload(){let n=0;for(const [k,f] of Object.entries(files)){try{templates[k]=normalizeTemplate((await loader.loadAsync(BASE+f)).scene);n++;setStatus(`加载 GLB 素材 ${n}/${Object.keys(files).length}`)}catch(e){console.error(k,e)}}if(!templates.small&&!templates.medium&&!templates.large)throw new Error('建筑 GLB 加载失败')}
function buildingInstance(b){const t=templates[b.type]||templates.medium||templates.small||templates.large;if(!t)return;const g=t.clone(true);g.name=b.id;g.scale.setScalar(b.height);g.position.set(b.x,0,b.z);g.rotation.y=b.rotation;g.userData.assetRoot=true;g.userData.sceneKind='building';g.userData.sceneId=b.id;g.userData.assetType=b.type;g.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true}});root.add(g)}
function treeInstance(t){const keys=['tree1','tree2','tree3'].filter(k=>templates[k]);if(!keys.length)return;const tpl=templates[keys[Math.abs(hash(t.id))%keys.length]];const g=tpl.clone(true);g.name=t.id;g.scale.setScalar(t.height);g.position.set(t.x,0,t.z);g.rotation.y=(Math.abs(hash(t.id+'r'))%628)/100;g.userData.assetRoot=true;g.userData.sceneKind='tree';g.userData.sceneId=t.id;root.add(g)}
function hash(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return h}
function makeRoads(){const w=sceneState.roadWidth,l=sceneState.roadLength;addBox('road','#202630',[0,.04,0],[w,.08,l]);addBox('road','#202630',[0,.04,0],[l,.08,w]);const sw=2.5;addBox('sidewalk','#73787f',[-(w/2+sw/2),.09,0],[sw,.18,l]);addBox('sidewalk','#73787f',[(w/2+sw/2),.09,0],[sw,.18,l]);addBox('sidewalk','#73787f',[0,.09,-(w/2+sw/2)],[l,.18,sw]);addBox('sidewalk','#73787f',[0,.09,(w/2+sw/2)],[l,.18,sw]);for(let i=-6;i<=6;i++){if(!i)continue;addBox('mark','#f1db88',[0,.1,i*3],[.1,.025,1.4]);addBox('mark','#f1db88',[i*3,.1,0],[1.4,.025,.1])}}
function renderState(){clearRoot();makeRoads();sceneState.buildings.forEach((b,i)=>{buildingInstance(b);if(sceneState.style==='cyber'){const cols=['#ff3fa4','#27e2ff','#9967ff','#ffd45a'];addBox('neon',cols[i%4],[b.x+(b.x<0?1.4:-1.4),Math.min(b.height*.55,4.8),b.z],[.08,.28,.75],cols[i%4])}});sceneState.trees.forEach(treeInstance);fit();setStatus(`${sceneState.buildings.length} 栋楼 · ${sceneState.trees.length} 棵树 · ${sceneState.style==='cyber'?'赛博':'现代'}布局`,'ok')}
function fit(){const b=new THREE.Box3().setFromObject(root);if(b.isEmpty())return;const s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),d=Math.max(s.x,s.y,s.z)*.62+5;camera.position.set(c.x+d*.75,c.y+Math.min(15,d*.5),c.z+d*.85);orbit.target.copy(c);orbit.update()}
function findRoot(o){while(o&&o!==root){if(o.userData?.assetRoot)return o;o=o.parent}return null}
function captureState(){const bs=[],ts=[];for(const o of root.children){if(o.userData.sceneKind==='building')bs.push({id:o.userData.sceneId,type:o.userData.assetType||'medium',x:+o.position.x.toFixed(2),z:+o.position.z.toFixed(2),height:+Math.max(.1,o.scale.y).toFixed(2),rotation:+o.rotation.y.toFixed(3)});else if(o.userData.sceneKind==='tree')ts.push({id:o.userData.sceneId,x:+o.position.x.toFixed(2),z:+o.position.z.toFixed(2),height:+Math.max(.1,o.scale.y).toFixed(2)})}if(bs.length)sceneState.buildings=bs;if(ts.length)sceneState.trees=ts}
renderer.domElement.addEventListener('pointerdown',e=>{if(transform.axis)return;const rect=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-rect.left)/rect.width)*2-1;pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(root.children,true);selected=hits.length?findRoot(hits[0].object):null;transform.detach();if(selected&&['building','tree'].includes(selected.userData.sceneKind))transform.attach(selected)});
document.getElementById('move').onclick=()=>transform.setMode('translate');document.getElementById('rotate').onclick=()=>transform.setMode('rotate');document.getElementById('scale').onclick=()=>transform.setMode('scale');document.getElementById('focus').onclick=fit;
const keyEl=document.getElementById('apiKey'),chat=document.getElementById('chat'),input=document.getElementById('chatInput'),send=document.getElementById('send');
keyEl.value=sessionStorage.getItem('deepseek_api_key')||'';keyEl.addEventListener('change',()=>{const v=keyEl.value.trim();if(v)sessionStorage.setItem('deepseek_api_key',v);else sessionStorage.removeItem('deepseek_api_key')});
document.getElementById('clearKey').onclick=()=>{keyEl.value='';sessionStorage.removeItem('deepseek_api_key')};document.querySelectorAll('.ex').forEach(e=>e.onclick=()=>input.value=e.textContent);
function addMsg(text,who='assistant'){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function sanitizeState(s){const out={style:s?.style==='cyber'?'cyber':'modern',roadWidth:clamp(s?.roadWidth,3,9,sceneState.roadWidth),roadLength:clamp(s?.roadLength,24,55,sceneState.roadLength),buildings:[],trees:[]};const seen=new Set();for(const [i,b] of (Array.isArray(s?.buildings)?s.buildings:[]).slice(0,30).entries()){let id=String(b.id||`b${i+1}`).slice(0,30);if(seen.has(id))id=`${id}_${i}`;seen.add(id);out.buildings.push({id,type:['small','medium','large'].includes(b.type)?b.type:'medium',x:clamp(b.x,-24,24,0),z:clamp(b.z,-24,24,0),height:clamp(b.height,2,16,6),rotation:clamp(b.rotation,-6.3,6.3,0)})}for(const [i,t] of (Array.isArray(s?.trees)?s.trees:[]).slice(0,60).entries())out.trees.push({id:String(t.id||`t${i+1}`).slice(0,30),x:clamp(t.x,-25,25,0),z:clamp(t.z,-25,25,0),height:clamp(t.height,.8,4,1.8)});if(!out.buildings.length)out.buildings=sceneState.buildings;return out}
const SYS=`You control a Three.js city scene by returning JSON only. The user will give an instruction and the current scene JSON. Return exactly one JSON object with keys assistant_message and scene. scene must contain style (modern or cyber), roadWidth, roadLength, buildings, trees. Each building: id,type (small|medium|large),x,z,height,rotation. Each tree: id,x,z,height. You may add, delete, move, resize and rotate objects. Preserve objects not mentioned unless the instruction implies a redesign. Keep roads near the origin. Constraints: max 30 buildings, max 60 trees, x/z -24..24, building height 2..16, tree height .8..4. Do not output markdown, comments, JavaScript or extra text.`;
async function askDeepSeek(){const key=keyEl.value.trim();const q=input.value.trim();if(!key){addMsg('先填 DeepSeek API Key。');return}if(!q)return;sessionStorage.setItem('deepseek_api_key',key);captureState();input.value='';addMsg(q,'user');send.disabled=true;const reply=addMsg('DeepSeek 正在思考…');const details=document.createElement('details');details.className='reason';details.open=true;details.innerHTML='<summary>思考过程（流式）</summary><pre></pre>';reply.appendChild(details);const pre=details.querySelector('pre');let reasoning='',content='';try{const body={model:'deepseek-flash',messages:[{role:'system',content:SYS},{role:'user',content:`Current scene JSON:\n${JSON.stringify(sceneState)}\n\nUser instruction:\n${q}`}],response_format:{type:'json_object'},thinking:{type:'enabled'},reasoning_effort:'high',stream:true,max_tokens:5000};const resp=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body)});if(!resp.ok){const txt=await resp.text();throw new Error(`DeepSeek ${resp.status}: ${txt.slice(0,260)}`)}if(!resp.body)throw new Error('浏览器没有拿到流式响应');const reader=resp.body.getReader(),decoder=new TextDecoder();let buf='';while(true){const {done,value}=await reader.read();if(done)break;buf+=decoder.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop()||'';for(const line of lines){const s=line.trim();if(!s.startsWith('data:'))continue;const data=s.slice(5).trim();if(!data||data==='[DONE]')continue;try{const j=JSON.parse(data),d=j.choices?.[0]?.delta||{};if(d.reasoning_content){reasoning+=d.reasoning_content;pre.textContent=reasoning;chat.scrollTop=chat.scrollHeight}if(d.content)content+=d.content}catch{}}}details.open=false;let result;try{result=JSON.parse(content)}catch{throw new Error('模型最终输出不是有效 JSON：'+content.slice(0,300))}sceneState=sanitizeState(result.scene);renderState();reply.childNodes[0].textContent=(result.assistant_message||`已应用：${sceneState.buildings.length} 栋楼，${sceneState.trees.length} 棵树。`)+'\n';chat.scrollTop=chat.scrollHeight}catch(e){console.error(e);reply.childNodes[0].textContent='调用失败：'+e.message+'\n';details.open=true;if(!reasoning)pre.textContent='没有收到 reasoning_content。若错误是 Failed to fetch，通常是浏览器直连 API 的跨域/网络限制。'}finally{send.disabled=false}}
send.onclick=askDeepSeek;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();askDeepSeek()}});
function resize(){const w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/Math.max(h,1);camera.updateProjectionMatrix();renderer.setSize(w,h,false)}new ResizeObserver(resize).observe(stage);resize();(function loop(){requestAnimationFrame(loop);orbit.update();renderer.render(scene,camera)})();
try{await preload();renderState()}catch(e){console.error(e);setStatus('GLB 加载失败：'+e.message,'err')}
</script>
