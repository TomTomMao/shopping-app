<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';

ui.key.value=sessionStorage.getItem('deepseek_api_key')||'';ui.limit.oninput=()=>ui.limitLabel.textContent=ui.limit.value;ui.key.onchange=()=>{const v=ui.key.value.trim();v?sessionStorage.setItem('deepseek_api_key',v):sessionStorage.removeItem('deepseek_api_key')};
const CATALOG={robot:{file:'./assets/RobotExpressive.glb',clips:['Idle','Walking','Running','Dance','Wave','Jump','Yes','No','Punch','ThumbsUp','Standing','Sitting']},fox:{file:'./assets/Fox.glb',clips:['Survey','Walk','Run']}};
let templates={},actors=new Map(),storyboard=null,project=null,history=[],playing=false,current=0,last=performance.now(),cameraDriven=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0e16);scene.fog=new THREE.Fog(0x0a0e16,25,70);const camera=new THREE.PerspectiveCamera(48,1,.1,200);camera.position.set(8,5,10);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;ui.stage.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enabled=false;controls.target.set(0,1.5,0);scene.add(new THREE.HemisphereLight(0xb8c8ff,0x1c1814,2));const sun=new THREE.DirectionalLight(0xfff0d8,3.3);sun.position.set(9,14,8);sun.castShadow=true;scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(36,24),new THREE.MeshStandardMaterial({color:0x18202b,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(36,36,0x35465f,0x202b3c);grid.position.y=.01;scene.add(grid);const world=new THREE.Group();scene.add(world);const loader=new GLTFLoader();
function log(t,c=''){const d=document.createElement('div');d.className='log '+c;d.textContent=t;ui.logs.appendChild(d);ui.logs.scrollTop=ui.logs.scrollHeight}function setStatus(t,c=''){ui.status.className='status '+c;ui.status.textContent=t}function clamp(n,a,b,f=0){n=Number(n);return Number.isFinite(n)?Math.max(a,Math.min(b,n)):f}function vec(a,f=[0,0,0]){return Array.isArray(a)&&a.length===3?a.map((n,i)=>clamp(n,-50,50,f[i])):[...f]}function smooth(t){return t*t*(3-2*t)}function lerp3(a,b,t){return a.map((v,i)=>THREE.MathUtils.lerp(v,b[i],t))}
async function preload(){let n=0;for(const [k,m] of Object.entries(CATALOG)){try{const g=await loader.loadAsync(m.file);templates[k]={scene:g.scene,animations:g.animations};n++;setStatus(`本地资产 ${n}/${Object.keys(CATALOG).length}`,'good')}catch(e){console.error(e);setStatus(`资产 ${k} 加载失败，将使用 fallback`,'warn')}}}
function fallback(type){const g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color:type==='fox'?0xf0a04c:0x7895ff});const body=new THREE.Mesh(new THREE.BoxGeometry(type==='fox'?1.4:1,type==='fox'?.7:1.4,.65),mat);body.position.y=type==='fox'?.7:1;g.add(body);const head=new THREE.Mesh(type==='fox'?new THREE.ConeGeometry(.45,.8,5):new THREE.SphereGeometry(.45,16,12),mat);head.position.set(type==='fox'?.9:0,type==='fox'?.95:2,0);if(type==='fox')head.rotation.z=-Math.PI/2;g.add(head);return {scene:g,animations:[]}}
function clearWorld(){actors.clear();while(world.children.length)world.remove(world.children[0])}function clipFor(type,name){const a=CATALOG[type].clips;return a.find(x=>x.toLowerCase()===String(name||'').toLowerCase())||a[0]}
function actor(spec){const tpl=templates[spec.type]||fallback(spec.type),model=SkeletonUtils.clone(tpl.scene);model.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true}});const wrap=new THREE.Group();wrap.add(model);const b=new THREE.Box3().setFromObject(model),s=b.getSize(new THREE.Vector3());model.scale.setScalar((spec.type==='fox'?1.5:2.6)/Math.max(.001,s.y));const b2=new THREE.Box3().setFromObject(model),c=b2.getCenter(new THREE.Vector3());model.position.set(-c.x,-b2.min.y,-c.z);wrap.position.fromArray(spec.position);wrap.rotation.y=spec.rotationY;wrap.scale.setScalar(spec.scale);world.add(wrap);const mixer=new THREE.AnimationMixer(model),actions={};for(const cl of tpl.animations||[])actions[cl.name]=mixer.clipAction(cl);const a={spec,wrap,mixer,actions,current:null};actors.set(spec.id,a);return a}
function setClip(a,name,t){const n=clipFor(a.spec.type,name);if(!a.actions[n])return;if(a.current!==n){a.mixer.stopAllAction();a.actions[n].reset().play();a.current=n}a.mixer.setTime(Math.max(0,t))}
function sanitize(raw){const limit=Number(ui.limit.value),duration=clamp(raw?.duration,4,45,12),assets=[];for(const [i,a] of (Array.isArray(raw?.assets)?raw.assets:[]).slice(0,limit).entries()){const type=['robot','fox'].includes(a.type)?a.type:'robot';assets.push({id:String(a.id||`a${i+1}`).replace(/[^a-zA-Z0-9_-]/g,'_'),label:String(a.label||a.id||`Asset ${i+1}`),type,position:vec(a.position,[i*2-2,0,0]).map((n,j)=>j===1?clamp(n,0,8,0):clamp(n,-12,12,0)),rotationY:clamp(a.rotationY,-6.3,6.3,0),scale:clamp(a.scale,.45,2.2,1),clip:clipFor(type,a.clip)})}if(!assets.length)assets.push({id:'robot1',label:'Robot',type:'robot',position:[0,0,0],rotationY:0,scale:1,clip:'Idle'});const ids=new Set(assets.map(a=>a.id)),shots=(Array.isArray(raw?.shots)?raw.shots:[]).slice(0,8).map((s,i)=>({id:String(s.id||`s${i+1}`),title:String(s.title||`Shot ${i+1}`),start:clamp(s.start,0,duration,0),end:clamp(s.end,0,duration,duration),camera:{from:vec(s.camera?.from,[7,4,9]),to:vec(s.camera?.to,[7,4,9]),lookAt:vec(s.camera?.lookAt,[0,1.4,0])},actions:(Array.isArray(s.actions)?s.actions:[]).slice(0,24).filter(a=>ids.has(a.target)).map(a=>({target:a.target,type:['move','rotate','scale','animation'].includes(a.type)?a.type:'move',start:clamp(a.start,0,duration,0),end:clamp(a.end,0,duration,duration),from:Array.isArray(a.from)?a.from.map(Number):null,to:Array.isArray(a.to)?a.to.map(Number):null,clip:a.clip?String(a.clip):null}))})).filter(s=>s.end>s.start);return {title:String(raw?.title||'Animation'),summary:String(raw?.summary||''),duration,assets,shots:shots.length?shots:[{id:'s1',title:'Main',start:0,end:duration,camera:{from:[7,4,9],to:[7,4,9],lookAt:[0,1.4,0]},actions:[]}]}}
function render(){if(!project)return;clearWorld();project.assets.forEach(actor);ui.json.textContent=JSON.stringify(project,null,2);ui.story.innerHTML=`<b>${project.title}</b><br><br>${project.summary}<br><br>${project.shots.map(s=>`${s.start.toFixed(1)}–${s.end.toFixed(1)}s · <b>${s.title}</b>`).join('<br>')}`;ui.assets.innerHTML=project.assets.map(a=>`<div class="asset"><b>${a.label}</b><br>${a.type} · ${a.clip} · [${a.position.join(', ')}]</div>`).join('');ui.seek.max=project.duration;ui.shots.innerHTML='';for(const s of project.shots){const d=document.createElement('div');d.className='shot';d.style.left=`${100*s.start/project.duration}%`;d.style.width=`${Math.max(2,100*(s.end-s.start)/project.duration)}%`;d.textContent=`${s.title} ${s.start.toFixed(1)}–${s.end.toFixed(1)}`;ui.shots.appendChild(d)}current=0;playing=false;apply(0);setStatus(`就绪：${project.assets.length} 个资产，${project.shots.length} 个镜头`,'good')}
function shotAt(t){return project?.shots.find(s=>t>=s.start&&t<s.end)||project?.shots.at(-1)}function apply(t){if(!project)return;for(const s of project.assets){const a=actors.get(s.id);if(!a)continue;a.wrap.position.fromArray(s.position);a.wrap.rotation.set(0,s.rotationY,0);a.wrap.scale.setScalar(s.scale);setClip(a,s.clip,t)}const sh=shotAt(t);if(sh){if(cameraDriven){const u=smooth(clamp((t-sh.start)/Math.max(.001,sh.end-sh.start),0,1));camera.position.fromArray(lerp3(sh.camera.from,sh.camera.to,u));camera.lookAt(...sh.camera.lookAt)}for(const ac of sh.actions){const a=actors.get(ac.target);if(!a||t<ac.start||t>ac.end)continue;const u=smooth(clamp((t-ac.start)/Math.max(.001,ac.end-ac.start),0,1));if(ac.type==='move'){const f=Array.isArray(ac.from)&&ac.from.length===3?ac.from:a.spec.position,tt=Array.isArray(ac.to)&&ac.to.length===3?ac.to:f;a.wrap.position.fromArray(lerp3(f,tt,u))}else if(ac.type==='rotate'){const f=Array.isArray(ac.from)?Number(ac.from[0]):a.spec.rotationY,tt=Array.isArray(ac.to)?Number(ac.to[0]):f;a.wrap.rotation.y=THREE.MathUtils.lerp(f,tt,u)}else if(ac.type==='scale'){const f=Array.isArray(ac.from)?Number(ac.from[0]):a.spec.scale,tt=Array.isArray(ac.to)?Number(ac.to[0]):f;a.wrap.scale.setScalar(THREE.MathUtils.lerp(f,tt,u))}else if(ac.type==='animation')setClip(a,ac.clip,t-ac.start)}}ui.time.textContent=`${t.toFixed(1)} / ${project.duration.toFixed(1)}s`;ui.seek.value=t}
const SYSTEM=`You are SceneForge Animate Director. Return JSON only, no markdown. You receive current project context and a user request. Produce a COMPLETE updated animation project. JSON shape: {title,summary,duration,assets,shots}. assets: [{id,label,type,position:[x,y,z],rotationY,scale,clip}]. Allowed type robot with clips Idle Walking Running Dance Wave Jump Yes No Punch ThumbsUp Standing Sitting, or fox with clips Survey Walk Run. Never exceed maxAssets. shots: [{id,title,start,end,camera:{from:[x,y,z],to:[x,y,z],lookAt:[x,y,z]},actions:[{target,type,start,end,from,to,clip}]}]. Action type move rotate scale animation. Use absolute seconds. Keep actors mostly y=0. Prefer 2-4 shots and visually clear camera framing. Preserve useful current context when the user asks for adjustments.`;
async function agent(text){const key=ui.key.value.trim();if(!key){log('请先输入 DeepSeek API Key','bad');return}sessionStorage.setItem('deepseek_api_key',key);const context={maxAssets:Number(ui.limit.value),availableAssets:CATALOG,currentProject:project,currentStoryboard:storyboard};history.push({role:'user',content:`Runtime context:\n${JSON.stringify(context)}\n\nUser request:\n${text}`});log(text,'user');ui.generate.disabled=true;setStatus('DeepSeek 正在规划…','warn');try{const body={model:'deepseek-flash',messages:[{role:'system',content:SYSTEM},...history],response_format:{type:'json_object'},thinking:{type:'enabled'},reasoning_effort:'high',max_tokens:6000};let r=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body)});if(!r.ok&&[400,404].includes(r.status)){body.model='deepseek-v4-flash';r=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body)})}if(!r.ok)throw new Error(`DeepSeek ${r.status}: ${(await r.text()).slice(0,300)}`);const data=await r.json(),m=data.choices?.[0]?.message;if(!m)throw new Error('DeepSeek 返回为空');if(m.reasoning_content)log(m.reasoning_content);const raw=JSON.parse(m.content);project=sanitize(raw);storyboard={title:project.title,summary:project.summary,duration:project.duration,shots:project.shots.map(s=>({id:s.id,title:s.title,start:s.start,end:s.end}))};history.push({role:'assistant',content:m.content});render()}catch(e){console.error(e);log(e.message,'bad');setStatus(e.message,'bad')}finally{ui.generate.disabled=false}}
const DEMO={title:'机器人舞台偶遇',summary:'两个机器人碰面，一个挥手，另一个跳舞，最后一起跑开。',duration:12,assets:[{id:'a',label:'Robot A',type:'robot',position:[-4,0,0],rotationY:1.57,scale:1,clip:'Walking'},{id:'b',label:'Robot B',type:'robot',position:[4,0,0],rotationY:-1.57,scale:1,clip:'Walking'}],shots:[{id:'s1',title:'相遇',start:0,end:4,camera:{from:[0,3.2,10],to:[0,3,9],lookAt:[0,1.4,0]},actions:[{target:'a',type:'move',start:0,end:3,from:[-4,0,0],to:[-1,0,0]},{target:'b',type:'move',start:0,end:3,from:[4,0,0],to:[1,0,0]},{target:'a',type:'animation',start:3,end:4,clip:'Wave'}]},{id:'s2',title:'跳舞',start:4,end:8,camera:{from:[0,3,8],to:[1,3,7],lookAt:[.5,1.4,0]},actions:[{target:'a',type:'move',start:4,end:8,from:[-1,0,0],to:[-1,0,0]},{target:'b',type:'move',start:4,end:8,from:[1,0,0],to:[1,0,0]},{target:'b',type:'animation',start:4,end:8,clip:'Dance'},{target:'a',type:'animation',start:4,end:8,clip:'Idle'}]},{id:'s3',title:'跑开',start:8,end:12,camera:{from:[0,3.5,9],to:[0,6,15],lookAt:[2,1.5,0]},actions:[{target:'a',type:'move',start:8,end:12,from:[-1,0,0],to:[9,0,0]},{target:'a',type:'animation',start:8,end:12,clip:'Running'},{target:'b',type:'move',start:8,end:12,from:[1,0,0],to:[11,0,0]},{target:'b',type:'animation',start:8,end:12,clip:'Running'}]}]};
ui.generate.onclick=()=>agent(ui.prompt.value.trim());ui.demo.onclick=()=>{project=sanitize(DEMO);render();log('本地 Demo 已加载')};ui.reset.onclick=()=>{history=[];project=null;storyboard=null;clearWorld();ui.story.textContent='上下文已重置';ui.assets.innerHTML='';ui.json.textContent='{}';ui.shots.innerHTML='';log('多轮上下文已重置')};ui.clearKey.onclick=()=>{ui.key.value='';sessionStorage.removeItem('deepseek_api_key')};ui.play.onclick=()=>{if(project){playing=!playing;ui.play.textContent=playing?'⏸ 暂停':'▶ 播放'}};ui.restart.onclick=()=>{if(project){current=0;playing=true;cameraDriven=true;controls.enabled=false;ui.orbit.textContent='自由镜头';ui.play.textContent='⏸ 暂停';apply(0)}};ui.orbit.onclick=()=>{cameraDriven=!cameraDriven;controls.enabled=!cameraDriven;ui.orbit.textContent=cameraDriven?'自由镜头':'跟随镜头'};ui.seek.oninput=()=>{if(project){current=Number(ui.seek.value);playing=false;ui.play.textContent='▶ 播放';apply(current)}};
